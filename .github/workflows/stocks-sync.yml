name: stocks-sync

# 走 GitHub Runner（无 Vercel 函数 60s 限制），保留 fetch-stocks.ts 原生 800ms 节流规避东方财富风控。
# 调度：每日 09:30 UTC=17:30 北京时间跑行情；周一加跑分红；可用 workflow_dispatch 手动触发。
# 前置条件：仓库 Secret DATABASE_URL（Vercel Postgres 连接串）。

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "同步模式"
        required: true
        default: quotes
        type: choice
        options:
          - quotes
          - dividends
          - all

permissions:
  contents: read
  issues: write

concurrency:
  group: stocks-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 判定本次运行模式
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$(date -u +%u)" = "1" ]; then
            MODE="all"
          else
            MODE="quotes"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次模式: $MODE"

      - name: 同步行情 quotes
        if: steps.mode.outputs.mode == 'quotes' || steps.mode.outputs.mode == 'all'
        run: node scripts/fetch-stocks.ts quotes

      - name: 同步分红 dividends
        if: steps.mode.outputs.mode == 'dividends' || steps.mode.outputs.mode == 'all'
        run: node scripts/fetch-stocks.ts dividends

      - name: 失败告警
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            const body = [
              "**stocks-sync 执行失败**",
              "",
              `- Run: ${url}`,
              `- 时间: ${new Date().toISOString()}`,
              `- 模式: ${{ steps.mode.outputs.mode }}`,
              "",
              "请检查日志，必要时手动调度一次补数。",
            ].join("\n")
            try {
              await github.rest.issues.create({
                owner,
                repo,
                title: `[stocks-sync] 同步失败 ${new Date().toISOString().slice(0, 16)}`,
                body,
                labels: ["watchdog"],
              })
            } catch (e) {
              core.warning(`无法创建 Issue（public repo 定时任务只读 token？）: ${e.message}`)
            }